name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Resolve version
        run: |
          ref="${GITHUB_REF_NAME#v}"
          if [[ ! "$ref" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then ref="0.0.1"; fi
          IFS=. read -r a b c <<< "$ref"
          echo "version=${a}.${b:-0}.${c:-0}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW-w64
        run: |
          /c/msys64/usr/bin/pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-make
          echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          gcc --version | head -1
          mingw32-make all -j4 VERSION=${{ needs.version.outputs.version }} CC="gcc -static"
          ./kollapse.exe --version
      - name: Check DLLs
        run: |
          # a download must start on a clean PC: only DLLs that ship with Windows
          bad=0
          for f in kollapse.exe kollapsew.exe; do
            dlls=$(objdump -p "$f" | sed -n 's/^\s*DLL Name: //p' | sort -u)
            echo "$f: $(echo $dlls)"
            for d in $dlls; do
              case "${d,,}" in
                kernel32.dll|user32.dll|gdi32.dll|winmm.dll|wininet.dll|advapi32.dll|shell32.dll|msvcrt.dll|ucrtbase.dll|api-ms-win-*) ;;
                *) echo "::error::$f needs $d, which Windows doesn't ship"; bad=1 ;;
              esac
            done
          done
          exit $bad
      - name: Package
        shell: pwsh
        run: |
          $d = New-Item -ItemType Directory -Force out/Kollapse
          Copy-Item kollapse.exe, kollapsew.exe, install.ps1, README.md, LICENSE $d
          Compress-Archive -Path out/Kollapse -DestinationPath Kollapse-Windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: Kollapse-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum Kollapse-Windows.zip | tee SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            Kollapse-Windows.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Verify a download with the [GitHub CLI](https://cli.github.com):"
            echo '```'
            echo "gh attestation verify Kollapse-Windows.zip --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" Kollapse-Windows.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Kollapse ${{ needs.version.outputs.version }}" --generate-notes --notes-file notes.md
